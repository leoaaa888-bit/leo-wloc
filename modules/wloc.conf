#!name=Leo WLOC 定位修改
#!desc=修改 Apple 网络定位返回坐标 (Quantumult X) | 选点页面: https://leo-wloc.pages.dev/ | QX 的 rewrite_local 脚本不支持参数, 坐标只能通过选点页面「储存到设备」写入; 未储存时为透传, 不改定位。
#!author=Leo
#!homepage=https://github.com/leoaaa888-bit/leo-wloc
#!icon=https://raw.githubusercontent.com/leoaaa888-bit/leo-wloc/main/assets/icon.png

[rewrite_local]
^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc url script-response-body https://raw.githubusercontent.com/leoaaa888-bit/leo-wloc/main/dist/wloc.js
^https?:\/\/gs-loc(-cn)?\.apple\.com\/wloc-settings\/save url script-echo-response https://raw.githubusercontent.com/leoaaa888-bit/leo-wloc/main/dist/wloc-settings.js

[mitm]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com
